name: Testing
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.82.0
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: tests
          activate-environment: false
          locked: true

      - name: Verify pixi and run tests
        run: |
          pixi --version
          pixi run -e tests tests

  test-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.82.0
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: tests
          activate-environment: false
          locked: true

      - name: Run doc tests
        run: pixi run -e tests test-docs